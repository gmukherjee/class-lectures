<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Lectures — Gourab Mukherjee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cardinal: #990000;
      --cardinal-dark: #6e0000;
      --gold: #ffcc00;
      --page: #f1ede4;
      --card: #ffffff;
      --ink: #333333;
      --muted: #6b6b6b;
      --topic-gray: #666666;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 16px;
      line-height: 1.6;
    }
    a { color: var(--cardinal); }

    /* ---------- Header ---------- */
    .site-header {
      background: #111111;
      border-top: 6px solid var(--gold);
      color: #fff;
      padding: 48px 16px 104px;
    }
    .site-header .inner { max-width: 1040px; margin: 0 auto; }
    .site-title {
      font-family: Lato, sans-serif;
      font-weight: 900;
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.1;
      margin: 0 0 10px;
    }
    .site-subtitle {
      font-family: Lato, sans-serif;
      font-size: 18px;
      color: var(--gold);
      margin: 0;
    }

    main { max-width: 1040px; margin: -72px auto 0; padding: 0 16px 64px; }

    /* ---------- Lecture boxes ---------- */
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .card {
      background: var(--card);
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      border-top: 4px solid var(--cardinal);
    }

    /* Number column on the left of each box */
    .num {
      background: var(--cardinal);
      color: #fff;
      text-align: center;
      padding: 22px 6px;
      font-family: Lato, sans-serif;
    }
    .num-label { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
    .num-value { font-size: 40px; font-weight: 900; line-height: 1.1; color: var(--gold); }

    .body { padding: 22px 26px 24px; display: flex; flex-direction: column; }
    .card-meta {
      font-family: Lato, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .card-title {
      font-family: Lato, sans-serif;
      font-weight: 700;
      font-size: 22px;
      line-height: 1.25;
      color: var(--cardinal);
      margin: 0 0 12px;
    }

    .topics { margin: 0 0 12px; padding-left: 1.2em; font-style: italic; color: var(--topic-gray); font-size: 15px; }
    .topics li { margin: 2px 0; }
    .note-link { font-weight: 700; white-space: nowrap; }
    .topic-note {
      margin: 4px 0 0;
      padding: 8px 12px;
      background: #fff7d6;
      border-left: 4px solid var(--gold);
      font-size: 14px;
    }

    /* Video and notes links sit right under the title, one per line */
    .buttons { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .btn {
      display: flex; align-items: center; gap: 10px;
      font-family: Lato, sans-serif; font-weight: 900; font-size: 16px;
      text-decoration: none;
      padding: 11px 16px;
      border: 2px solid var(--cardinal);
      transition: background .15s, color .15s, border-color .15s;
    }
    .btn.video { background: var(--cardinal); color: #fff; }
    .btn.notes { background: var(--gold); border-color: var(--gold); color: var(--ink); }
    .btn:hover { background: var(--cardinal-dark); border-color: var(--cardinal-dark); color: var(--gold); }
    .btn svg { width: 18px; height: 18px; flex: none; }
    .btn .arrow { margin-left: auto; font-weight: 400; }

    footer {
      text-align: center; font-family: Lato, sans-serif; font-size: 14px; color: var(--muted);
      padding: 24px 16px 40px;
    }

    @media (max-width: 720px) {
      .grid { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 480px) {
      .card { grid-template-columns: 60px minmax(0, 1fr); }
      .num { padding: 16px 4px; }
      .num-value { font-size: 30px; }
      .num-label { font-size: 9px; }
      .body { padding: 18px 16px 20px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <h1 class="site-title" id="course-title"></h1>
    <p class="site-subtitle" id="course-subtitle"></p>
  </div>
</header>

<main>
  <div class="grid" id="lectures"></div>
</main>

<footer id="footer"></footer>

<script>
  /* =====================================================================
     EDIT HERE — course info
     ===================================================================== */
  const COURSE = {
    title: "Lecture Videos & Class Notes",
    subtitle: "Gourab Mukherjee · USC Marshall School of Business",
  };

  /* =====================================================================
     EDIT HERE — one entry per lecture. To post a new lecture, copy a block,
     bump the number, and fill in the fields. Order doesn't matter; boxes
     are shown from Lecture 1 to the latest.

       number : lecture number
       date   : "YYYY-MM-DD"
       title  : headline shown in the box
       videos : one or more recordings, each { label, url } with a Panopto
                viewer link; [] if none yet
       notes  : link to notes (Google Drive folder/file, PDF, etc.); "" if none
       topics : list of bullet points
       note   : optional remark shown under the topics; leave out if none
       noteLink : optional { label, url } link shown at the end of the note
     ===================================================================== */
  const LECTURES = [
    {
      number: 7,
      date: "2026-11-09",
      title: "Statistical Models & Uncertainty in Regression",
      videos: [
        { label: "Classroom", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=0d22f48a-2394-4f43-953c-b4e5017a7abe" },
      ],
      notes: "https://drive.google.com/drive/folders/1wlXAr3bigG2oTnd70x0X9QOqHFttSaWc?usp=drive_link",
      topics: [
        "Population & Sample",
        "Uncertainty in Linear Regression",
        "Interpretability of the regression model",
        "What are Statistical Models?",
        "The Regression Model",
      ],
    },
    {
      number: 6,
      date: "2026-11-04",
      title: "Quiz 1 & Project Milestone 2",
      videos: [],
      notes: "",
      topics: [
        "Quiz 1",
        "Project Milestone 2 discussion",
      ],
      note: "Project video is on Brightspace in the Project module.",
    },
    {
      number: 5,
      date: "2026-11-02",
      title: "Multiple Linear Regression",
      videos: [
        { label: "Classroom", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=8595e748-ab13-4b3e-af75-b4e5017a7923" },
      ],
      notes: "https://drive.google.com/drive/folders/1MV0rWhy6RwRvaD6UmzabqUyNdO12uONo?usp=sharing",
      topics: [
        "Multiple Linear Regression",
        "Practice Quiz 1",
      ],
      note: "Entire Solution Video for Practice Quiz 1 is available at",
      noteLink: { label: "Panopto", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=39ed9aeb-6aaf-4676-880c-b4f700647d30" },
    },
    {
      number: 4,
      date: "2026-10-28",
      title: "Simple Linear Regression",
      videos: [
        { label: "Classroom", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=d3a74c7d-9f79-4fd2-a33c-b4e5017a7858" },
      ],
      notes: "https://drive.google.com/drive/folders/1zMzPB_bvV5qh8l7ci8ycdRT9qQ1qww9N?usp=drive_link",
      topics: [
        "Simple linear regression",
        "Intercept and slope",
        "Least-squares regression",
        "Predictions for new observations",
      ],
    },
    {
      number: 3,
      date: "2026-10-26",
      title: "Data Visualization",
      videos: [
        { label: "Classroom", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=0649b3fa-21a9-492a-bbab-b4e5017a77a5&start=145.919509" },
      ],
      notes: "https://drive.google.com/drive/folders/1XYY8ln4QE13pEcpYpu_R_vA7CBh0oVkg?usp=drive_link",
      topics: [
        "More on Summary Statistics and Graphs",
        "Exploratory Data Analysis",
        "Dashboarding",
      ],
    },
    {
      number: 2,
      date: "2026-10-21",
      title: "R, RStudio & Agentic AI for Data Analysis",
      videos: [
        { label: "Classroom", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=f61c6964-2e93-4994-be1b-b4e5017a6b7d" },
        { label: "Mac screen", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=93348361-88a2-41f6-b236-b4ea0113e15b" },
      ],
      notes: "https://drive.google.com/drive/folders/1KnX6jiFdvnOTn44cScMgdpcs6jKZ2Wyr?usp=drive_link",
      topics: [
        "R & RStudio",
        "Agentic AI workflow: Data Analysis",
        "Getting started with Data Analysis",
        "Brainstorming on Projects",
      ],
      note: "Agentic data analysis is recorded in the Mac screen video; it is not in the Panopto classroom recording.",
    },
    {
      number: 1,
      date: "2026-10-19",
      title: "Introduction & Descriptive Statistics",
      videos: [
        { label: "Classroom", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=817fcdfc-9786-4426-9bad-b4e5017a6abf" },
      ],
      notes: "https://drive.google.com/drive/folders/1dYNULz-MBSEZdwxlPJnkyK1tY48gA2go?usp=drive_link",
      topics: [
        "Introduction and Course Organization",
        "Descriptive Statistics & Visualization",
        "Type of Variables",
        "Plotting Distributions: Bar & Pie Charts, Histogram",
        "Measures of Center",
        "Measures of Spread",
      ],
    },
  ];

  /* ===================================================================== */

  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  const ICON_NOTES = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>';

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function fmtDate(iso) {
    const d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }

  function buttons(l) {
    const vids = l.videos || [];
    let html = "";
    vids.forEach(v => {
      const label = vids.length > 1 ? `Lecture video: ${v.label}` : "Lecture video (Panopto)";
      html += `<a class="btn video" href="${esc(v.url)}" target="_blank" rel="noopener">${ICON_PLAY}${esc(label)}<span class="arrow">↗</span></a>`;
    });
    if (l.notes) html += `<a class="btn notes" href="${esc(l.notes)}" target="_blank" rel="noopener">${ICON_NOTES}Class notes<span class="arrow">↗</span></a>`;
    return html ? `<div class="buttons">${html}</div>` : "";
  }

  function lectureCard(l) {
    const topics = (l.topics || []).length
      ? `<ul class="topics">${l.topics.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : "";
    const link = l.noteLink
      ? ` <a class="note-link" href="${esc(l.noteLink.url)}" target="_blank" rel="noopener">${esc(l.noteLink.label)} ↗</a>` : "";
    const note = l.note ? `<p class="topic-note"><strong>Note:</strong> ${esc(l.note)}${link}</p>` : "";
    return `
      <article class="card">
        <div class="num"><div class="num-label">Lecture</div><div class="num-value">${esc(l.number)}</div></div>
        <div class="body">
          <div class="card-meta">${esc(fmtDate(l.date))}</div>
          <h2 class="card-title">${l.title ? esc(l.title) : `Lecture ${esc(l.number)}`}</h2>
          ${buttons(l)}
          ${topics}
          ${note}
        </div>
      </article>`;
  }

  // Lecture 1 first, latest last
  const sorted = [...LECTURES].sort((a, b) => a.number - b.number);
  document.getElementById("course-title").textContent = COURSE.title;
  document.getElementById("course-subtitle").textContent = COURSE.subtitle;
  document.title = COURSE.title;
  document.getElementById("footer").textContent = `${sorted.length} lecture${sorted.length === 1 ? "" : "s"} posted`;
  document.getElementById("lectures").innerHTML = sorted.map(lectureCard).join("");
</script>
</body>
</html>
