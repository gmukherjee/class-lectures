<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Lectures — Gourab Mukherjee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cardinal: #990000;
      --cardinal-dark: #6e0000;
      --gold: #ffcc00;
      --page: #f1ede4;
      --card: #ffffff;
      --ink: #333333;
      --muted: #6b6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 16px;
      line-height: 1.7;
    }
    a { color: var(--cardinal); }

    /* ---------- Header ---------- */
    .site-header {
      background: var(--cardinal);
      border-top: 6px solid var(--gold);
      color: #fff;
      padding: 56px 16px 120px;
    }
    .site-header .inner { max-width: 960px; margin: 0 auto; }
    .site-title {
      font-family: Lato, sans-serif;
      font-weight: 900;
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.1;
      margin: 0 0 10px;
      position: relative;
    }
    .site-subtitle {
      font-family: Lato, sans-serif;
      font-size: 18px;
      color: var(--gold);
      margin: 0;
    }

    main { max-width: 960px; margin: -80px auto 0; padding: 0 16px 64px; position: relative; }

    /* ---------- Episode cards ---------- */
    .card {
      background: var(--card);
      padding: 40px;
      margin-bottom: 32px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .card.featured { padding: 48px 40px; border-top: 6px solid var(--gold); }
    .card-meta {
      font-family: Lato, sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .card-title {
      font-family: Lato, sans-serif;
      font-weight: 700;
      font-size: 30px;
      line-height: 1.2;
      color: var(--cardinal);
      margin: 0 0 24px;
    }
    .featured .card-title { font-weight: 900; font-size: clamp(30px, 4.5vw, 42px); }

    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      margin-bottom: 24px;
    }
    .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    .video-tabs { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 0; }
    .video-tab {
      font-family: Lato, sans-serif; font-weight: 700; font-size: 14px;
      padding: 9px 18px; border: 0; cursor: pointer;
      background: #e4dfd2; color: var(--ink);
    }
    .video-tab[aria-selected="true"] { background: var(--cardinal); color: #fff; box-shadow: inset 0 -4px 0 var(--gold); }

    .topics-label {
      font-family: Lato, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .topics { margin: 0 0 28px; padding-left: 1.2em; }
    .topics li { margin: 2px 0; }
    .topic-note {
      margin: -12px 0 28px;
      padding: 12px 16px;
      background: #fff7d6;
      border-left: 4px solid var(--gold);
      font-size: 15px;
    }

    .buttons { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: Lato, sans-serif; font-weight: 700; font-size: 15px;
      text-decoration: none;
      padding: 11px 20px;
      border: 2px solid var(--cardinal);
      color: var(--cardinal);
      background: #fff;
      transition: background .15s, color .15s;
    }
    .btn.primary { background: var(--cardinal); color: #fff; }
    .btn:hover { background: var(--cardinal-dark); border-color: var(--cardinal-dark); color: var(--gold); }
    .btn svg { width: 18px; height: 18px; flex: none; }

    footer {
      text-align: center; font-family: Lato, sans-serif; font-size: 14px; color: var(--muted);
      padding: 24px 16px 40px;
    }

    @media (max-width: 600px) {
      .card, .card.featured { padding: 24px 18px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <h1 class="site-title" id="course-title"></h1>
    <p class="site-subtitle" id="course-subtitle"></p>
  </div>
</header>

<main>
  <div id="lectures"></div>
</main>

<footer id="footer"></footer>

<script>
  /* =====================================================================
     EDIT HERE — course info
     ===================================================================== */
  const COURSE = {
    title: "Lecture Videos & Class Notes",
    subtitle: "Gourab Mukherjee · USC Marshall School of Business",
  };

  /* =====================================================================
     EDIT HERE — one entry per lecture. To post a new lecture, copy a block,
     bump the number, and fill in the fields. Order doesn't matter; each
     lecture gets its own box, highest number at the top.

       number : lecture number
       date   : "YYYY-MM-DD"
       title  : headline shown in the box
       videos : one or more recordings, each { label, url } with a Panopto
                viewer link (embedded automatically); [] if none yet
       notes  : link to notes (Google Drive folder/file, PDF, etc.); "" if none
       topics : list of bullet points
       note   : optional remark shown under the topics; leave out if none
     ===================================================================== */
  const LECTURES = [
    {
      number: 4,
      date: "2026-10-28",
      title: "Simple Linear Regression",
      videos: [
        { label: "Classroom", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=d3a74c7d-9f79-4fd2-a33c-b4e5017a7858" },
      ],
      notes: "https://drive.google.com/drive/folders/1zMzPB_bvV5qh8l7ci8ycdRT9qQ1qww9N?usp=drive_link",
      topics: [
        "Simple linear regression",
        "Intercept and slope",
        "Least-squares regression",
        "Predictions for new observations",
      ],
    },
    {
      number: 3,
      date: "2026-10-26",
      title: "Data Visualization",
      videos: [
        { label: "Classroom", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=0649b3fa-21a9-492a-bbab-b4e5017a77a5&start=145.919509" },
      ],
      notes: "https://drive.google.com/drive/folders/1XYY8ln4QE13pEcpYpu_R_vA7CBh0oVkg?usp=drive_link",
      topics: [
        "More on Summary Statistics and Graphs",
        "Exploratory Data Analysis",
        "Dashboarding",
      ],
    },
    {
      number: 2,
      date: "2026-10-21",
      title: "R, RStudio & Agentic AI for Data Analysis",
      videos: [
        { label: "Classroom", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=f61c6964-2e93-4994-be1b-b4e5017a6b7d" },
        { label: "Mac screen", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=93348361-88a2-41f6-b236-b4ea0113e15b" },
      ],
      notes: "https://drive.google.com/drive/folders/1KnX6jiFdvnOTn44cScMgdpcs6jKZ2Wyr?usp=drive_link",
      topics: [
        "R & RStudio",
        "Agentic AI workflow: Data Analysis",
        "Getting started with Data Analysis",
        "Brainstorming on Projects",
      ],
      note: "Agentic data analysis is recorded in the Mac screen video; it is not in the Panopto classroom recording.",
    },
    {
      number: 1,
      date: "2026-10-19",
      title: "Introduction & Descriptive Statistics",
      videos: [
        { label: "Classroom", url: "https://usc-marshall-panopto-demo.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=817fcdfc-9786-4426-9bad-b4e5017a6abf" },
      ],
      notes: "https://drive.google.com/drive/folders/1dYNULz-MBSEZdwxlPJnkyK1tY48gA2go?usp=drive_link",
      topics: [
        "Introduction and Course Organization",
        "Descriptive Statistics & Visualization",
        "Type of Variables",
        "Plotting Distributions: Bar & Pie Charts, Histogram",
        "Measures of Center",
        "Measures of Spread",
      ],
    },
  ];

  /* ===================================================================== */

  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  const ICON_NOTES = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>';

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function fmtDate(iso) {
    const d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }

  // Panopto "Viewer.aspx?id=..." -> "Embed.aspx?id=..." so it plays inside the box
  function panoptoEmbed(url) {
    if (!/panopto/i.test(url) || !/Viewer\.aspx/i.test(url)) return null;
    const u = new URL(url.replace(/Viewer\.aspx/i, "Embed.aspx"));
    u.searchParams.set("autoplay", "false");
    u.searchParams.set("offerviewer", "true");
    u.searchParams.set("showtitle", "false");
    u.searchParams.set("interactivity", "all");
    return u.toString();
  }

  function buttons(l) {
    const vids = l.videos || [];
    let html = "";
    vids.forEach(v => {
      const label = vids.length > 1 ? `Watch: ${v.label}` : "Watch on Panopto";
      html += `<a class="btn primary" href="${esc(v.url)}" target="_blank" rel="noopener">${ICON_PLAY}${esc(label)}</a>`;
    });
    if (l.notes) html += `<a class="btn" href="${esc(l.notes)}" target="_blank" rel="noopener">${ICON_NOTES}Class notes</a>`;
    return html ? `<div class="buttons">${html}</div>` : "";
  }

  function topicList(l) {
    if (!l.topics || !l.topics.length) return "";
    const note = l.note ? `<p class="topic-note"><strong>Note:</strong> ${esc(l.note)}</p>` : "";
    return `<p class="topics-label">Topics covered</p><ul class="topics">${l.topics.map(t => `<li>${esc(t)}</li>`).join("")}</ul>${note}`;
  }

  // Embedded player; with several recordings, tabs above it switch between them
  function player(l) {
    const vids = (l.videos || []).map(v => ({ ...v, embed: panoptoEmbed(v.url) })).filter(v => v.embed);
    if (!vids.length) return "";
    const tabs = vids.length > 1
      ? `<div class="video-tabs" role="tablist">${vids.map((v, i) =>
          `<button class="video-tab" role="tab" aria-selected="${i === 0}" data-src="${esc(v.embed)}">${esc(v.label)}</button>`).join("")}</div>`
      : "";
    return `${tabs}<div class="video"><iframe src="${esc(vids[0].embed)}" loading="lazy" allowfullscreen allow="autoplay; fullscreen" title="Lecture ${esc(l.number)} video"></iframe></div>`;
  }

  function lectureCard(l, isNewest) {
    return `
      <article class="card featured">
        <div class="card-meta">${isNewest ? "New lecture: " : ""}${esc(fmtDate(l.date))}</div>
        <h2 class="card-title">Lecture ${esc(l.number)}${l.title ? `: ${esc(l.title)}` : ""}</h2>
        ${player(l)}
        ${topicList(l)}
        ${buttons(l)}
      </article>`;
  }

  const sorted = [...LECTURES].sort((a, b) => b.number - a.number);
  document.getElementById("course-title").textContent = COURSE.title;
  document.getElementById("course-subtitle").textContent = COURSE.subtitle;
  document.title = COURSE.title;
  document.getElementById("footer").textContent = `${sorted.length} lecture${sorted.length === 1 ? "" : "s"} posted`;

  const list = document.getElementById("lectures");
  list.innerHTML = sorted.map((l, i) => lectureCard(l, i === 0)).join("");

  // Each box's tabs switch only that box's player
  list.querySelectorAll(".card").forEach(card => {
    const tabs = card.querySelectorAll(".video-tab");
    tabs.forEach(t => t.addEventListener("click", () => {
      tabs.forEach(x => x.setAttribute("aria-selected", x === t));
      card.querySelector(".video iframe").src = t.dataset.src;
    }));
  });
</script>
</body>
</html>
